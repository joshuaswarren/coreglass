[project]
name = "coreglass"
version = "0.1.0"
description = "See where local inference loses speed on Apple Silicon under Linux"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coreglass = "coreglass.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coreglass"]

[tool.setuptools.package-data]
coreglass = ["fonts/*"]
