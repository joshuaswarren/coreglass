    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/><stop offset="0.55" stop-color="#ff2a6d"/><stop offset="1" stop-color="#9d2bff"/>
